[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limen-mcp"
version = "0.1.0"
description = "A local, secret-safe audit of MCP server configuration risk"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Limen contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
limen-mcp = "limen_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["limen_mcp*"]
